[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB

lib_deps =
  PowerBroker2/ELMduino @ ^3.1.2
  bodmer/TFT_eSPI @ ^2.5.31
  madhephaestus/ESP32Encoder

build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=5
  -D TFT_RST=4

  -D ENC_CLK=32
  -D ENC_DT=33
  -D ENC_SW=27


  -D TFT_RGB_ORDER=TFT_BGR
  -D LOAD_GLCD=1
  -D LOAD_GFXFF=1        ; FreeSans / FreeSansBold fonts used everywhere
  -D SPI_FREQUENCY=27000000